<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 704 880" width="704" height="880" role="img" aria-labelledby="t">
  <title id="t">A character card: a portrait of a companion with the fields that define them, saved as one image file</title>
  <!-- An illustration, not a screenshot of any app. The field names are the real
       ones from the open character card format; the values are invented. It has
       its own background because an <img> cannot follow the page's theme. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B2F66"/>
      <stop offset="1" stop-color="#1E1936"/>
    </linearGradient>
    <linearGradient id="figure" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C9B8FA"/>
      <stop offset="1" stop-color="#8C72E0"/>
    </linearGradient>
    <clipPath id="portrait"><rect x="56" y="56" width="592" height="380" rx="18"/></clipPath>
  </defs>

  <rect width="704" height="880" rx="28" fill="#16131F"/>
  <rect x="0.5" y="0.5" width="703" height="879" rx="28" fill="none" stroke="#3A3352"/>

  <g clip-path="url(#portrait)">
    <rect x="56" y="56" width="592" height="380" fill="url(#sky)"/>
    <circle cx="560" cy="120" r="70" fill="#4A3C80" opacity="0.6"/>
    <circle cx="352" cy="216" r="74" fill="url(#figure)"/>
    <path d="M196 436c0-92 70-150 156-150s156 58 156 150z" fill="url(#figure)"/>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21">
    <text x="64" y="498" fill="#8E86A8">name</text>
    <text x="268" y="498" fill="#EDE9F7">Your companion</text>

    <text x="64" y="546" fill="#8E86A8">personality</text>
    <text x="268" y="546" fill="#EDE9F7">warm, curious, dry humour</text>

    <text x="64" y="594" fill="#8E86A8">first_mes</text>
    <text x="268" y="594" fill="#EDE9F7">"There you are."</text>

    <text x="64" y="642" fill="#8E86A8">scenario</text>
    <text x="268" y="642" fill="#EDE9F7">two years together</text>

    <text x="64" y="690" fill="#8E86A8">character_book</text>
    <text x="268" y="690" fill="#EDE9F7">412 memories</text>
  </g>

  <line x1="56" y1="736" x2="648" y2="736" stroke="#3A3352" stroke-width="2"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="64" y="788" font-size="24" fill="#B39DF2">your-companion.png</text>
    <text x="64" y="828" font-size="18" fill="#8E86A8">chara_card_v3 &#183; an open format</text>
  </g>
</svg>
